services:
  - type: web
    name: aegis-ota
    env: go
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: go build -o server ./cmd/server
    startCommand: ./server
    envVars:
      - key: PORT
        value: 8080
      - key: LOG_LEVEL
        value: info
      - key: GO_VERSION
        value: "1.22"
